name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --project-name cleaner_app --platforms=android .

      - name: Add photo library package
        run: flutter pub add photo_manager

      - name: Add Android permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Use my code
        run: cp main.dart lib/main.dart

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cleaner-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
